<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Auswertung · Der Hundezuchtverein</title>
<style>
  body { font: 16px/1.5 "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif; margin: 0; background: #E8ECF0; color: #12181F; }
  header { background: #0B5C7A; color: #fff; padding: 18px 28px; border-bottom: 4px solid #D96F00; }
  header h1 { margin: 0; font: 700 1.6rem "Segoe UI", Arial, sans-serif; } header p { margin: 4px 0 0; color: #DCEAF2; }
  main { padding: 20px 28px 60px; max-width: 1200px; margin: 0 auto; }
  h2 { font: 700 1.3rem "Segoe UI", Arial, sans-serif; margin: 28px 0 8px; border-bottom: 2px solid #0B5C7A; padding-bottom: 4px; color: #08425A; }
  h3 { font: 700 1.05rem "Segoe UI", Arial, sans-serif; margin: 18px 0 6px; }
  table { border-collapse: collapse; width: 100%; background: #fff; font-size: .93rem; margin: 6px 0 14px; }
  th, td { border: 1px solid #B9C4CD; padding: 5px 9px; text-align: left; vertical-align: top; }
  th { background: #DCEAF2; } td.n, th.n { text-align: right; white-space: nowrap; }
  tr.warn td { background: #FDE9D8; } tr.ok td { background: #EAF4EE; }
  .drop { border: 3px dashed #0B5C7A; border-radius: 4px; padding: 26px; text-align: center; background: #fff; }
  button, input[type=file] { font: inherit; } button { padding: 8px 16px; border-radius: 4px; border: 2px solid #12181F; background: #fff; cursor: pointer; }
  .muted { color: #586370; } .tag { display: inline-block; padding: 1px 8px; border-radius: 3px; background: #F6C99A; font-size: .82rem; }
  .txt { white-space: pre-wrap; background: #fff; border: 1px solid #B9C4CD; padding: 8px 10px; margin: 4px 0; }
  @media print { .drop, button { display: none; } body { background: #fff; } }
</style>
</head>
<body>
<header><h1>Auswertung · Der Hundezuchtverein</h1><p>Nur für die Lehrkraft. Die Dateien werden nur in diesem Browser gelesen und nirgendwohin gesendet.</p></header>
<main>
  <div class="drop">
    <p><strong>Spielstand-Dateien der Teams auswählen</strong> (mehrere gleichzeitig möglich, Endung .json, Namen beginnen mit „mendel_“)</p>
    <input id="files" type="file" accept=".json,application/json" multiple>
  </div>
  <div id="out"></div>
</main>
<script>
var ALL_CATALOG = [
  ['mendel-1', 'Raum 1 · Das Vereinsbüro (Teil 1)', [['probe-vererbung', 'Vererbt oder nicht?'], ['probe-brief', 'Der Brief (Beobachtung, Deutung, Behauptung)'], ['probe-wuerfe-tabelle', 'Aussagen und Belege (Tabelle)'], ['probe-wuerfe-zahl', 'Anteil in Prozent']]],
  ['mendel-2', 'Raum 2 · Das Zuchtlabor (Teil 3)', [['lab-versuch1', 'Versuch 1: Reinzucht und Kreuzung'], ['lab-aussage1', 'Aussage zu Versuch 1'], ['lab-versuch2', 'Versuch 2: zweite Generation'], ['lab-aussage2', 'Verhältnis in Versuch 2'], ['lab-versuch3', 'Versuch 3: Testverpaarung'], ['lab-aussage3', 'Wer trägt die Anlage?']]],
  ['mendel-3', 'Raum 3 · Das Gartenbuch (Teil 5)', [['probe-methode', 'Warum Erbsen? (Mendels Methode)'], ['probe-erbsen-zahlen', 'Mendels Zahlen (Stichprobe)'], ['probe-stammbaum', 'Genotypen im Stammbaum'], ['probe-stammbaum-test', 'Ist die Mutter KK?'], ['probe-einspruch-markup', 'Einspruch prüfen'], ['probe-einspruch-skizze', 'Skizze mit Modell M4']]]
];
var TEAMS = [];
function esc(s) { return String(s == null ? '' : s).replace(/[&<>]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]; }); }
function mins(ms) { return ms == null ? '–' : (ms / 60000).toFixed(1).replace('.', ','); }
function median(a) { if (!a.length) return null; a = a.slice().sort(function (x, y) { return x - y; }); var m = a.length >> 1; return a.length % 2 ? a[m] : (a[m - 1] + a[m]) / 2; }

function analyse(state, fname) {
  var log = (state.log || []).map(function (l) { return { t: new Date(l.t).getTime(), e: l.e }; });
  var res = { name: (state.team || []).join(', ') || fname, file: fname, puzzles: {}, missions: {}, state: state };
  log.forEach(function (l) {
    var m;
    if ((m = /^öffnet (\S+)/.exec(l.e))) { var p = res.puzzles[m[1]] = res.puzzles[m[1]] || { fails: 0, hints: 0 }; if (p.open == null) p.open = l.t; }
    else if ((m = /^fehlversuch (\S+)/.exec(l.e))) { (res.puzzles[m[1]] = res.puzzles[m[1]] || { fails: 0, hints: 0 }).fails++; }
    else if ((m = /^gelöst (\S+)/.exec(l.e))) { var q = res.puzzles[m[1]] = res.puzzles[m[1]] || { fails: 0, hints: 0 }; if (q.done == null) q.done = l.t; }
    else if ((m = /^freigeschaltet (\S+)/.exec(l.e))) { res.missions[m[1]] = res.missions[m[1]] || {}; res.missions[m[1]].start = l.t; }
  });
  Object.keys(state.hints || {}).forEach(function (id) { (res.puzzles[id] = res.puzzles[id] || { fails: 0, hints: 0 }).hints = state.hints[id]; });
  Object.keys(state.solved || {}).forEach(function (id) {
    var p = res.puzzles[id] = res.puzzles[id] || { fails: 0, hints: 0 };
    p.solved = true; p.rescue = !!(state.solved[id] && state.solved[id].rescue);
    if (p.done == null && state.solved[id] && state.solved[id].t && state.solved[id].t !== 'code') p.done = new Date(state.solved[id].t).getTime();
  });
  ALL_CATALOG.forEach(function (c) {
    var last = null; c[2].forEach(function (pp) { var p = res.puzzles[pp[0]]; if (p && p.done && (last == null || p.done > last)) last = p.done; });
    var m = res.missions[c[0]]; if (m && m.start && last && state.solved[c[0]]) m.ms = last - m.start;
  });
  res.total = log.length ? log[log.length - 1].t - log[0].t : null;
  return res;
}
function pTime(p) { return p && p.open != null && p.done != null ? p.done - p.open : null; }

function render() {
  var out = document.getElementById('out'), h = '';
  if (!TEAMS.length) { out.innerHTML = ''; return; }
  var CATALOG = ALL_CATALOG.filter(function (c) { return TEAMS.some(function (t) { return t.missions[c[0]] || c[2].some(function (pp) { return t.puzzles[pp[0]]; }); }); });
  h += '<h2>Klassenübersicht (' + TEAMS.length + ' Team' + (TEAMS.length === 1 ? '' : 's') + ')</h2>';
  h += '<p class="muted">Zeit = vom ersten Öffnen des Rätsels bis zur Lösung (Minuten, Median). Orange markiert: mindestens ein Team mit Notfallöffnung oder im Schnitt mehr als drei Fehlversuche. Viele Fehlversuche bei Auswahlfragen können auch Raten bedeuten, prüft dann die Begründungen im Logbuch.</p>';
  h += '<table><tr><th>Rätsel</th><th class="n">gelöst</th><th class="n">Zeit (Median)</th><th class="n">Fehlversuche (Ø)</th><th class="n">mit Tipp 3</th><th class="n">Notfall</th></tr>';
  CATALOG.forEach(function (c) {
    var mt = TEAMS.map(function (t) { return t.missions[c[0]] && t.missions[c[0]].ms; }).filter(function (x) { return x != null; });
    h += '<tr><th colspan="6">' + esc(c[1]) + ' · Missionszeit (Median): ' + mins(median(mt)) + ' Min. (' + mt.length + ' Team' + (mt.length === 1 ? '' : 's') + ' fertig)</th></tr>';
    c[2].forEach(function (pp) {
      var ps = TEAMS.map(function (t) { return t.puzzles[pp[0]]; });
      var solved = ps.filter(function (p) { return p && p.solved; }).length;
      var times = ps.map(pTime).filter(function (x) { return x != null; });
      var fails = ps.filter(Boolean).map(function (p) { return p.fails; });
      var avgF = fails.length ? fails.reduce(function (a, b) { return a + b; }, 0) / fails.length : 0;
      var t3 = ps.filter(function (p) { return p && p.hints >= 3; }).length;
      var nf = ps.filter(function (p) { return p && p.rescue; }).length;
      h += '<tr class="' + ((nf || avgF > 3) ? 'warn' : (solved === TEAMS.length ? 'ok' : '')) + '"><td>' + esc(pp[1]) + ' <span class="muted">(' + pp[0] + ')</span></td><td class="n">' + solved + '/' + TEAMS.length + '</td><td class="n">' + mins(median(times)) + '</td><td class="n">' + avgF.toFixed(1).replace('.', ',') + '</td><td class="n">' + t3 + '</td><td class="n">' + nf + '</td></tr>';
    });
  });
  h += '</table>';
  TEAMS.forEach(function (t) {
    h += '<h2>Team ' + esc(t.name) + ' <span class="muted">(' + esc(t.file) + ')</span></h2><p class="muted">Gesamtdauer der protokollierten Zeit: ' + mins(t.total) + ' Min.</p>';
    h += '<table><tr><th>Rätsel</th><th>Status</th><th class="n">Zeit (Min.)</th><th class="n">Tipps</th><th class="n">Fehlversuche</th></tr>';
    CATALOG.forEach(function (c) {
      c[2].forEach(function (pp) {
        var p = t.puzzles[pp[0]] || { fails: 0, hints: 0 };
        var status = p.solved ? (p.rescue ? '<span class="tag">Notfallöffnung</span>' : 'gelöst') : (p.open != null ? 'begonnen' : '–');
        h += '<tr class="' + (p.rescue ? 'warn' : '') + '"><td>' + esc(pp[1]) + '</td><td>' + status + '</td><td class="n">' + mins(pTime(p)) + '</td><td class="n">' + (p.hints || 0) + '</td><td class="n">' + (p.fails || 0) + '</td></tr>';
      });
    });
    h += '</table>';
    var sims = (t.state.vars && t.state.vars.sim) || {};
    Object.keys(sims).forEach(function (k) {
      if (!(sims[k].runs || []).length) return;
      h += '<h3>Gespeicherte Läufe (' + esc(k) + ')</h3><table><tr><th>Lauf</th><th>Ergebnis</th></tr>';
      sims[k].runs.forEach(function (r) { h += '<tr><td>' + esc(r.label) + '</td><td>' + esc(r.summary) + '</td></tr>'; });
      h += '</table>';
    });
    var ans = t.state.answers || {}, keys = Object.keys(ans);
    if (keys.length) {
      h += '<h3>Texte des Teams</h3>';
      keys.forEach(function (k) { h += '<div><strong>' + esc(ans[k].title) + '</strong><div class="txt">' + esc(ans[k].text) + '</div></div>'; });
    }
  });
  out.innerHTML = h;
}
document.getElementById('files').addEventListener('change', function (ev) {
  TEAMS = []; var files = [].slice.call(ev.target.files), left = files.length;
  if (!left) { render(); return; }
  files.forEach(function (f) {
    var r = new FileReader();
    r.onload = function () {
      try { var d = JSON.parse(r.result); if (d.format === 'mendel-spielstand' && d.state) TEAMS.push(analyse(d.state, f.name)); else alert(f.name + ' ist keine Spielstand-Datei dieses Spiels.'); }
      catch (e) { alert(f.name + ' konnte nicht gelesen werden.'); }
      if (--left === 0) { TEAMS.sort(function (a, b) { return a.name < b.name ? -1 : 1; }); render(); }
    };
    r.readAsText(f);
  });
});
</script>
</body>
</html>
